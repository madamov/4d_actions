name: Download and cache tool4d

on:
  workflow_call:
    inputs:
      version:
        description: "4D version, for example: 21.1, 20.8, or 20.8 HF3"
        required: true
        type: string

      runner:
        description: "Runner on which tool4d will be used"
        required: false
        type: string
        default: "macos-latest"

    outputs:
      url:
        description: "Resolved tool4d download URL"
        value: ${{ jobs.download.outputs.url }}

      build:
        description: "Selected build number"
        value: ${{ jobs.download.outputs.build }}

      os:
        description: "Resolved operating-system identifier"
        value: ${{ jobs.download.outputs.os }}

      target:
        description: "Resolved architecture identifier"
        value: ${{ jobs.download.outputs.target }}

      cache_key:
        description: "Cache key used for tool4d"
        value: ${{ jobs.download.outputs.cache_key }}

      cache_hit:
        description: "Whether tool4d was restored from cache"
        value: ${{ jobs.download.outputs.cache_hit }}

      install_path:
        description: "Directory containing extracted tool4d"
        value: ${{ jobs.download.outputs.install_path }}

      executable:
        description: "Full path to the tool4d executable"
        value: ${{ jobs.download.outputs.executable }}

jobs:
  download:
    name: Download tool4d ${{ inputs.version }}
    runs-on: ${{ inputs.runner }}

    outputs:
      url: ${{ steps.resolve.outputs.url }}
      build: ${{ steps.resolve.outputs.build }}
      os: ${{ steps.resolve.outputs.os }}
      target: ${{ steps.resolve.outputs.target }}
      cache_key: ${{ steps.resolve.outputs.cache_key }}
      cache_hit: ${{ steps.cache.outputs.cache-hit }}
      install_path: ${{ steps.resolve.outputs.install_path }}
      executable: ${{ steps.locate.outputs.executable }}

    steps:
      - name: Resolve platform, build and URL
        id: resolve
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}

          VERSIONS_JSON: |
            [
              {"version":"20.8","build":"101985","os":"mac","target":"arm64"},
              {"version":"20.8","build":"101985","os":"mac","target":"x86_64"},
              {"version":"20.8","build":"101985","os":"win","target":"x86_64"},
              {"version":"21.1","build":"100468","os":"win","target":"x86_64"},
              {"version":"21.1","build":"100468","os":"mac","target":"x86_64"},
              {"version":"21.2","build":"100579","os":"mac","target":"arm64"},
              {"version":"21.2","build":"100579","os":"mac","target":"x86_64"},
              {"version":"21.2","build":"100579","os":"win","target":"x86_64"},
              {"version":"21.1","build":"100468","os":"mac","target":"arm64"},
              {"version":"20.8 HF3","build":"hotfix","os":"mac","target":"arm64"},
              {"version":"20.8 HF3","build":"hotfix","os":"mac","target":"x86_64"},
              {"version":"20.8 HF3","build":"hotfix","os":"win","target":"x86_64"},
              {"version":"20.8 HF4","build":"hotfix","os":"mac","target":"arm64"},
              {"version":"20.8 HF4","build":"hotfix","os":"mac","target":"x86_64"},
              {"version":"20.8 HF4","build":"hotfix","os":"win","target":"x86_64"},
              {"version":"21 R3","build":"100164","os":"mac","target":"arm64"},
              {"version":"21 R3","build":"100164","os":"mac","target":"x86_64"},
              {"version":"21 R3","build":"100164","os":"win","target":"x86_64"}
            ]

        run: |
          set -euo pipefail

          echo "Requested version   : $REQUESTED_VERSION"
          echo "Runner OS           : $RUNNER_OS_VALUE"
          echo "Runner architecture : $RUNNER_ARCH_VALUE"

          case "$RUNNER_OS_VALUE" in
            macOS)
              TOOL4D_OS="mac"

              case "$RUNNER_ARCH_VALUE" in
                ARM64)
                  TOOL4D_TARGET="arm64"
                  TOOL4D_ARCHIVE="tool4d_arm64.tar.xz"
                  ;;

                X64)
                  TOOL4D_TARGET="x86_64"
                  TOOL4D_ARCHIVE="tool4d_x86_64.tar.xz"
                  ;;

                *)
                  echo "::error::Unsupported macOS architecture: $RUNNER_ARCH_VALUE"
                  exit 1
                  ;;
              esac
              ;;

            Windows)
              TOOL4D_OS="win"
              TOOL4D_TARGET="x86_64"
              TOOL4D_ARCHIVE="tool4d_win.tar.xz"
              ;;

            *)
              echo "::error::Unsupported operating system: $RUNNER_OS_VALUE"
              echo "::error::Only Windows and macOS are supported."
              exit 1
              ;;
          esac

          SELECTED_ENTRY="$(
            jq -c \
              --arg version "$REQUESTED_VERSION" \
              --arg os "$TOOL4D_OS" \
              --arg target "$TOOL4D_TARGET" \
              '
              [
                .[]
                | select(
                    .version == $version
                    and .os == $os
                    and .target == $target
                  )
                | . + {
                    "_build_sort":
                      if (.build | test("^[0-9]+$"))
                      then (.build | tonumber)
                      else -1
                      end
                  }
              ]
              | sort_by(._build_sort)
              | last
              | if . == null
                then null
                else del(._build_sort)
                end
              ' <<< "$VERSIONS_JSON"
          )"

          if [[ "$SELECTED_ENTRY" == "null" || -z "$SELECTED_ENTRY" ]]; then
            echo "::error::No matching tool4d version was found."
            echo "::error::Version: $REQUESTED_VERSION"
            echo "::error::OS: $TOOL4D_OS"
            echo "::error::Target: $TOOL4D_TARGET"

            echo "Available versions:"

            jq -r \
              '.[].version' <<< "$VERSIONS_JSON" |
              sort -u

            exit 1
          fi

          BUILD="$(jq -r '.build' <<< "$SELECTED_ENTRY")"

          if [[ "$REQUESTED_VERSION" =~ ^([0-9]+)\. ]]; then
            MAJOR_VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Invalid version format: $REQUESTED_VERSION"
            exit 1
          fi

          VERSION_PATH="${REQUESTED_VERSION// /%20}"

          URL="https://product-download.4d.com/release/${MAJOR_VERSION}.x/${VERSION_PATH}/${BUILD}/${TOOL4D_OS}/${TOOL4D_ARCHIVE}"

          SAFE_VERSION="$(
            printf '%s' "$REQUESTED_VERSION" |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/[^a-z0-9._-]+/-/g'
          )"

          CACHE_KEY="tool4d-${SAFE_VERSION}-${TOOL4D_OS}-${TOOL4D_TARGET}"

          INSTALL_PATH="${RUNNER_TOOL_CACHE}/${CACHE_KEY}"
          
          echo "Selected entry:"
          jq . <<< "$SELECTED_ENTRY"

          echo "Resolved URL : $URL"
          echo "Cache key    : $CACHE_KEY"
          echo "Install path : $INSTALL_PATH"

          {
            echo "url=$URL"
            echo "build=$BUILD"
            echo "os=$TOOL4D_OS"
            echo "target=$TOOL4D_TARGET"
            echo "archive=$TOOL4D_ARCHIVE"
            echo "cache_key=$CACHE_KEY"
            echo "install_path=$INSTALL_PATH"
          } >> "$GITHUB_OUTPUT"

      - name: Restore tool4d cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.resolve.outputs.install_path }}
          key: ${{ steps.resolve.outputs.cache_key }}

      - name: Download tool4d archive
        if: steps.cache.outputs.cache-hit != 'true'
        id: download
        shell: bash
        env:
          DOWNLOAD_URL: ${{ steps.resolve.outputs.url }}
          ARCHIVE_NAME: ${{ steps.resolve.outputs.archive }}
        run: |
          set -euo pipefail
      
          DOWNLOAD_DIRECTORY="$RUNNER_TEMP/tool4d-download"
          ARCHIVE_PATH="$DOWNLOAD_DIRECTORY/$ARCHIVE_NAME"
          HEADERS_PATH="$DOWNLOAD_DIRECTORY/headers.txt"
      
          rm -rf "$DOWNLOAD_DIRECTORY"
          mkdir -p "$DOWNLOAD_DIRECTORY"
      
          echo "Downloading:"
          echo "$DOWNLOAD_URL"
      
          curl \
            --fail \
            --location \
            --show-error \
            --silent \
            --retry 3 \
            --retry-delay 5 \
            --dump-header "$HEADERS_PATH" \
            --output "$ARCHIVE_PATH" \
            "$DOWNLOAD_URL"
      
          if [[ ! -s "$ARCHIVE_PATH" ]]; then
            echo "::error::Downloaded archive is missing or empty: $ARCHIVE_PATH"
            exit 1
          fi
      
          echo "Downloaded file:"
          ls -lh "$ARCHIVE_PATH"
      
          echo "Response headers:"
          cat "$HEADERS_PATH"
      
          echo "Detected file type:"
          file "$ARCHIVE_PATH" || true
      
          echo "First 32 bytes:"
          od -An -tx1 -N32 "$ARCHIVE_PATH" || true
      
          echo "archive_path=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"

      - name: Extract tool4d archive
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          ARCHIVE_PATH: ${{ steps.download.outputs.archive_path }}
          INSTALL_PATH: ${{ steps.resolve.outputs.install_path }}
        run: |
          set -euo pipefail
      
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ARCHIVE_PATH_UNIX="$(cygpath -u "$ARCHIVE_PATH")"
            INSTALL_PATH_UNIX="$(cygpath -u "$INSTALL_PATH")"
          else
            ARCHIVE_PATH_UNIX="$ARCHIVE_PATH"
            INSTALL_PATH_UNIX="$INSTALL_PATH"
          fi
      
          echo "Archive path : $ARCHIVE_PATH_UNIX"
          echo "Install path : $INSTALL_PATH_UNIX"
      
          rm -rf "$INSTALL_PATH_UNIX"
          mkdir -p "$INSTALL_PATH_UNIX"
      
          tar -xf "$ARCHIVE_PATH_UNIX" -C "$INSTALL_PATH_UNIX"
      
          echo "Extracted files:"
          find "$INSTALL_PATH_UNIX" -maxdepth 4 -print

      - name: Locate tool4d executable
        id: locate
        shell: bash
        env:
          INSTALL_PATH: ${{ steps.resolve.outputs.install_path }}
        run: |
          set -euo pipefail
      
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            SEARCH_PATH="$(cygpath -u "$INSTALL_PATH")"
          else
            SEARCH_PATH="$INSTALL_PATH"
          fi
      
          if [[ ! -d "$SEARCH_PATH" ]]; then
            echo "::error::tool4d installation directory does not exist: $INSTALL_PATH"
            exit 1
          fi
      
          case "$RUNNER_OS" in
            macOS)
              TOOL4D_EXECUTABLE="$(
                find "$SEARCH_PATH" \
                  -type f \
                  -name "tool4d" \
                  -print \
                  -quit
              )"
              ;;
      
            Windows)
              TOOL4D_EXECUTABLE_UNIX="$(
                find "$SEARCH_PATH" \
                  -type f \
                  -iname "tool4d.exe" \
                  -print \
                  -quit
              )"
      
              if [[ -n "$TOOL4D_EXECUTABLE_UNIX" ]]; then
                TOOL4D_EXECUTABLE="$(cygpath -w "$TOOL4D_EXECUTABLE_UNIX")"
              else
                TOOL4D_EXECUTABLE=""
              fi
              ;;
      
            *)
              echo "::error::Unsupported runner OS: $RUNNER_OS"
              exit 1
              ;;
          esac
      
          if [[ -z "$TOOL4D_EXECUTABLE" ]]; then
            echo "::error::tool4d executable was not found in: $INSTALL_PATH"
            exit 1
          fi
      
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            TOOL4D_DIRECTORY="$(dirname "$(cygpath -u "$TOOL4D_EXECUTABLE")")"
            TOOL4D_DIRECTORY="$(cygpath -w "$TOOL4D_DIRECTORY")"
          else
            chmod +x "$TOOL4D_EXECUTABLE"
            TOOL4D_DIRECTORY="$(dirname "$TOOL4D_EXECUTABLE")"
          fi
      
          echo "executable=$TOOL4D_EXECUTABLE" >> "$GITHUB_OUTPUT"
          echo "TOOL4D_HOME=$INSTALL_PATH" >> "$GITHUB_ENV"
          echo "TOOL4D_EXECUTABLE=$TOOL4D_EXECUTABLE" >> "$GITHUB_ENV"
          echo "$TOOL4D_DIRECTORY" >> "$GITHUB_PATH"
      
          echo "tool4d executable: $TOOL4D_EXECUTABLE"

      - name: Add result to job summary
        shell: bash
        env:
          URL: ${{ steps.resolve.outputs.url }}
          BUILD: ${{ steps.resolve.outputs.build }}
          TOOL4D_OS: ${{ steps.resolve.outputs.os }}
          TOOL4D_TARGET: ${{ steps.resolve.outputs.target }}
          CACHE_KEY: ${{ steps.resolve.outputs.cache_key }}
          INSTALL_PATH: ${{ steps.resolve.outputs.install_path }}
          TOOL4D_EXECUTABLE: ${{ steps.locate.outputs.executable }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          {
            echo "## tool4d"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Version | \`${{ inputs.version }}\` |"
            echo "| Build | \`$BUILD\` |"
            echo "| OS | \`$TOOL4D_OS\` |"
            echo "| Target | \`$TOOL4D_TARGET\` |"
            echo "| Cache key | \`$CACHE_KEY\` |"
            echo "| Cache hit | \`$CACHE_HIT\` |"
            echo "| Install path | \`$INSTALL_PATH\` |"
            echo "| Executable | \`$TOOL4D_EXECUTABLE\` |"
            echo "| URL | $URL |"
          } >> "$GITHUB_STEP_SUMMARY"
