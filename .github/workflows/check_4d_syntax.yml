name: Check 4D project syntax

on:
  workflow_call:
    inputs:
      startup_method:
        description: "4D startup method used to check syntax"
        required: true
        type: string

      user_parameters:
        description: "JSON passed to tool4d through --user-param"
        required: true
        type: string

      runner:
        description: "Runner used to execute tool4d"
        required: false
        type: string
        default: "macos-latest"

    outputs:
      success:
        description: "Value of the success property from the tool4d result"
        value: ${{ jobs.check-syntax.outputs.success }}

      error_file:
        description: "Full path to the tool4d syntax result JSON file"
        value: ${{ jobs.check-syntax.outputs.error_file }}

permissions:
  contents: read

jobs:
  check-syntax:
    name: Check 4D project syntax
    runs-on: ${{ inputs.runner }}

    outputs:
      success: ${{ steps.syntax-result.outputs.success }}
      error_file: ${{ steps.syntax-result.outputs.error_file }}

    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v4

      - name: Locate 4D project and determine tool4d cache key
        id: resolve
        shell: bash
        env:
          VERSIONS_JSON: |
            [
              {"version":"20.8","build":"101985","os":"mac","target":"arm64"},
              {"version":"20.8","build":"101985","os":"mac","target":"x86_64"},
              {"version":"20.8","build":"101985","os":"win","target":"x86_64"},

              {"version":"20.8 HF3","build":"hotfix","os":"mac","target":"arm64"},
              {"version":"20.8 HF3","build":"hotfix","os":"mac","target":"x86_64"},
              {"version":"20.8 HF3","build":"hotfix","os":"win","target":"x86_64"},
        
              {"version":"21.1","build":"100468","os":"mac","target":"arm64"},
              {"version":"21.1","build":"100468","os":"mac","target":"x86_64"},
              {"version":"21.1","build":"100468","os":"win","target":"x86_64"},
              {"version":"21.2","build":"100579","os":"mac","target":"arm64"},
              {"version":"21.2","build":"100579","os":"mac","target":"x86_64"},
              {"version":"21.2","build":"100579","os":"win","target":"x86_64"},
              
              {"version":"21 R3","build":"100164","os":"mac","target":"arm64"},
              {"version":"21 R3","build":"100164","os":"mac","target":"x86_64"},
              {"version":"21 R3","build":"100164","os":"win","target":"x86_64"}

        run: |
          set -euo pipefail

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            WORKSPACE_SEARCH_PATH="$(cygpath -u "$GITHUB_WORKSPACE")"
          else
            WORKSPACE_SEARCH_PATH="$GITHUB_WORKSPACE"
          fi

           PROJECT_FILES=()
           
           while IFS= read -r project_file; do
             PROJECT_FILES+=("$project_file")
           done < <(
             find "$WORKSPACE_SEARCH_PATH" \
               -type f \
               -iname "*.4DProject" \
               -not -path "*/.git/*" \
               -print
           )

          PROJECT_COUNT="${#PROJECT_FILES[@]}"

          if [[ "$PROJECT_COUNT" -eq 0 ]]; then
            echo "::error::No .4DProject file was found in the calling repository."
            exit 1
          fi

          if [[ "$PROJECT_COUNT" -gt 1 ]]; then
            echo "::error::More than one .4DProject file was found:"
            printf '  %s\n' "${PROJECT_FILES[@]}"
            exit 1
          fi

          PROJECT_FILE_UNIX="${PROJECT_FILES[0]}"

          COMPATIBILITY_VERSION="$(
            jq -er '.compatibilityVersion' "$PROJECT_FILE_UNIX"
          )"

          if ! [[ "$COMPATIBILITY_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::compatibilityVersion must be numeric."
            echo "::error::Found: $COMPATIBILITY_VERSION"
            exit 1
          fi

          if [[ "$COMPATIBILITY_VERSION" -lt 100 ]]; then
            echo "::error::Unexpected compatibilityVersion: $COMPATIBILITY_VERSION"
            exit 1
          fi

          VERSION_MAJOR=$((COMPATIBILITY_VERSION / 100))
          VERSION_MINOR=$((COMPATIBILITY_VERSION % 100))
          TOOL4D_VERSION="${VERSION_MAJOR}.${VERSION_MINOR}"
          
          # Determine the tool4d operating system and architecture before
          # searching VERSIONS_JSON.
          case "$RUNNER_OS" in
            macOS)
              TOOL4D_OS="mac"
          
              case "$RUNNER_ARCH" in
                ARM64)
                  TOOL4D_TARGET="arm64"
                  ;;
                X64)
                  TOOL4D_TARGET="x86_64"
                  ;;
                *)
                  echo "::error::Unsupported macOS architecture: $RUNNER_ARCH"
                  exit 1
                  ;;
              esac
          
              TOOL4D_ARCHIVE="tool4d_${TOOL4D_TARGET}.tar.xz"
              ;;
          
            Windows)
              TOOL4D_OS="win"
              TOOL4D_TARGET="x86_64"
              TOOL4D_ARCHIVE="tool4d_win.tar.xz"
              ;;
          
            *)
              echo "::error::Unsupported runner operating system: $RUNNER_OS"
              exit 1
              ;;
          esac
          
          SELECTED_ENTRY="$(
            jq -c \
              --arg version "$TOOL4D_VERSION" \
              --arg os "$TOOL4D_OS" \
              --arg target "$TOOL4D_TARGET" \
              '
              [
                .[]
                | select(
                    .version == $version
                    and .os == $os
                    and .target == $target
                  )
                | . + {
                    "_build_sort":
                      if (.build | test("^[0-9]+$"))
                      then (.build | tonumber)
                      else -1
                      end
                  }
              ]
              | sort_by(._build_sort)
              | last
              | if . == null
                then null
                else del(._build_sort)
                end
              ' <<< "$VERSIONS_JSON"
          )"
          
          if [[ "$SELECTED_ENTRY" == "null" || -z "$SELECTED_ENTRY" ]]; then
            echo "::error::No tool4d download is configured for:"
            echo "::error::Version: $TOOL4D_VERSION"
            echo "::error::OS: $TOOL4D_OS"
            echo "::error::Target: $TOOL4D_TARGET"
            exit 1
          fi
          
          TOOL4D_BUILD="$(jq -r '.build' <<< "$SELECTED_ENTRY")"
          
          URL="https://product-download.4d.com/release/${VERSION_MAJOR}.x/${TOOL4D_VERSION}/${TOOL4D_BUILD}/${TOOL4D_OS}/${TOOL4D_ARCHIVE}"
          
          CACHE_KEY="tool4d-${TOOL4D_VERSION}-${TOOL4D_OS}-${TOOL4D_TARGET}"
          INSTALL_PATH="${RUNNER_TOOL_CACHE}/${CACHE_KEY}"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PROJECT_FILE="$(cygpath -w "$PROJECT_FILE_UNIX")"
          else
            PROJECT_FILE="$PROJECT_FILE_UNIX"
          fi

          echo "4D project          : $PROJECT_FILE"
          echo "compatibilityVersion: $COMPATIBILITY_VERSION"
          echo "tool4d version      : $TOOL4D_VERSION"
          echo "tool4d build        : $TOOL4D_BUILD"
          echo "Download archive    : $TOOL4D_ARCHIVE"
          echo "Download URL        : $URL"
          echo "Cache key           : $CACHE_KEY"
          echo "Install path        : $INSTALL_PATH"

          {
            echo "project_file=$PROJECT_FILE"
            echo "project_file_unix=$PROJECT_FILE_UNIX"
            echo "compatibility_version=$COMPATIBILITY_VERSION"
            echo "tool4d_version=$TOOL4D_VERSION"
            echo "tool4d_build=$TOOL4D_BUILD"
            echo "archive=$TOOL4D_ARCHIVE"
            echo "url=$URL"
            echo "cache_key=$CACHE_KEY"
            echo "install_path=$INSTALL_PATH"
          } >> "$GITHUB_OUTPUT"

      - name: Restore tool4d cache
        id: tool4d-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.resolve.outputs.install_path }}
          key: ${{ steps.resolve.outputs.cache_key }}

      - name: Download tool4d when not cached
        if: steps.tool4d-cache.outputs.cache-hit != 'true'
        id: download-tool4d
        shell: bash
        env:
          DOWNLOAD_URL: ${{ steps.resolve.outputs.url }}
          ARCHIVE_NAME: ${{ steps.resolve.outputs.archive }}
        run: |
          set -euo pipefail
      
          DOWNLOAD_DIRECTORY="$RUNNER_TEMP/tool4d-download"
          ARCHIVE_PATH="$DOWNLOAD_DIRECTORY/$ARCHIVE_NAME"
      
          rm -rf "$DOWNLOAD_DIRECTORY"
          mkdir -p "$DOWNLOAD_DIRECTORY"
      
          echo "Cache not found. Downloading:"
          echo "$DOWNLOAD_URL"
      
          curl \
            --fail \
            --location \
            --show-error \
            --silent \
            --retry 3 \
            --retry-delay 5 \
            --output "$ARCHIVE_PATH" \
            "$DOWNLOAD_URL"
      
          if [[ ! -s "$ARCHIVE_PATH" ]]; then
            echo "::error::Downloaded tool4d archive is missing or empty."
            exit 1
          fi
      
          echo "archive_path=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"
      
          ls -lh "$ARCHIVE_PATH"
      
      - name: Extract downloaded tool4d
        if: steps.tool4d-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          ARCHIVE_PATH: ${{ steps.download-tool4d.outputs.archive_path }}
          INSTALL_PATH: ${{ steps.resolve.outputs.install_path }}
        run: |
          set -euo pipefail
      
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ARCHIVE_PATH_FOR_BASH="$(cygpath -u "$ARCHIVE_PATH")"
            INSTALL_PATH_FOR_BASH="$(cygpath -u "$INSTALL_PATH")"
          else
            ARCHIVE_PATH_FOR_BASH="$ARCHIVE_PATH"
            INSTALL_PATH_FOR_BASH="$INSTALL_PATH"
          fi
      
          rm -rf "$INSTALL_PATH_FOR_BASH"
          mkdir -p "$INSTALL_PATH_FOR_BASH"
      
          tar -xf "$ARCHIVE_PATH_FOR_BASH" \
            -C "$INSTALL_PATH_FOR_BASH"
      
          find "$INSTALL_PATH_FOR_BASH" -maxdepth 4 -print

      - name: Locate tool4d executable
        id: tool4d
        shell: bash
        env:
          INSTALL_PATH: ${{ steps.resolve.outputs.install_path }}
        run: |
          set -euo pipefail

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            SEARCH_PATH="$(cygpath -u "$INSTALL_PATH")"
          else
            SEARCH_PATH="$INSTALL_PATH"
          fi

          if [[ ! -d "$SEARCH_PATH" ]]; then
            echo "::error::Restored tool4d directory does not exist:"
            echo "::error::$INSTALL_PATH"
            exit 1
          fi

          case "$RUNNER_OS" in
            macOS)
              TOOL4D_EXECUTABLE="$(
                find "$SEARCH_PATH" \
                  -type f \
                  -path "*/tool4d.app/Contents/MacOS/tool4d" \
                  -print \
                  -quit
              )"

              if [[ -z "$TOOL4D_EXECUTABLE" ]]; then
                TOOL4D_EXECUTABLE="$(
                  find "$SEARCH_PATH" \
                    -type f \
                    -name "tool4d" \
                    -print \
                    -quit
                )"
              fi
              ;;

            Windows)
              TOOL4D_EXECUTABLE_UNIX="$(
                find "$SEARCH_PATH" \
                  -type f \
                  -iname "tool4d.exe" \
                  -print \
                  -quit
              )"

              if [[ -n "$TOOL4D_EXECUTABLE_UNIX" ]]; then
                TOOL4D_EXECUTABLE="$(
                  cygpath -w "$TOOL4D_EXECUTABLE_UNIX"
                )"
              else
                TOOL4D_EXECUTABLE=""
              fi
              ;;
          esac

          if [[ -z "$TOOL4D_EXECUTABLE" ]]; then
            echo "::error::tool4d executable was not found in:"
            echo "::error::$INSTALL_PATH"
            exit 1
          fi

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            chmod +x "$TOOL4D_EXECUTABLE"
          fi

          echo "tool4d executable: $TOOL4D_EXECUTABLE"

          echo "executable=$TOOL4D_EXECUTABLE" >> "$GITHUB_OUTPUT"

      - name: Validate user parameters
        shell: bash
        env:
          USER_PARAMETERS: ${{ inputs.user_parameters }}
        run: |
          set -euo pipefail

          if ! jq -e . >/dev/null 2>&1 <<< "$USER_PARAMETERS"; then
            echo "::error::user_parameters is not valid JSON."
            exit 1
          fi

          echo "User parameters:"
          jq . <<< "$USER_PARAMETERS"

      - name: Check 4D project syntax
        id: run-tool4d
        shell: bash
        env:
          TOOL4D_EXECUTABLE: ${{ steps.tool4d.outputs.executable }}
          PROJECT_FILE: ${{ steps.resolve.outputs.project_file }}
          PROJECT_FILE_UNIX: ${{ steps.resolve.outputs.project_file_unix }}
          STARTUP_METHOD: ${{ inputs.startup_method }}
          USER_PARAMETERS: ${{ inputs.user_parameters }}
        run: |
          set -uo pipefail
      
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            DOCUMENTS_PATH="$USERPROFILE\\Documents"
            WORKSPACE_PATH="$GITHUB_WORKSPACE"
          else
            DOCUMENTS_PATH="$HOME/Documents"
            WORKSPACE_PATH="$GITHUB_WORKSPACE"
          fi
      
          USER_PARAMETERS="$(
            jq -c \
              --arg documents "$DOCUMENTS_PATH" \
              --arg workspace "$WORKSPACE_PATH" \
              '
              walk(
                if type == "string"
                then
                  gsub("__DOCUMENTS__"; $documents)
                  | gsub("__WORKSPACE__"; $workspace)
                else .
                end
              )
              ' <<< "$USER_PARAMETERS"
          )"
      
          ERROR_FOLDER_PATH="$(
            jq -er '.errorFolderPath // empty' <<< "$USER_PARAMETERS"
          )"
      
          if [[ -z "$ERROR_FOLDER_PATH" ]]; then
            echo "::error::user_parameters does not contain errorFolderPath."
            exit 1
          fi
      
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ERROR_FOLDER_FOR_BASH="$(cygpath -u "$ERROR_FOLDER_PATH")"
          else
            ERROR_FOLDER_FOR_BASH="$ERROR_FOLDER_PATH"
          fi
      
          mkdir -p "$ERROR_FOLDER_FOR_BASH"
      
          if [[ ! -d "$ERROR_FOLDER_FOR_BASH" ]]; then
            echo "::error::Unable to create error folder: $ERROR_FOLDER_PATH"
            exit 1
          fi
      
          PROJECT_FILENAME="$(basename "$PROJECT_FILE_UNIX")"
          PROJECT_NAME="${PROJECT_FILENAME%.4DProject}"
          ERROR_FILE_FOR_BASH="${ERROR_FOLDER_FOR_BASH}/${PROJECT_NAME}_errors.json"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ERROR_FILE="$(cygpath -w "$ERROR_FILE_FOR_BASH")"
          else
            ERROR_FILE="$ERROR_FILE_FOR_BASH"
          fi
      
          # Remove a result from a previous invocation.
          rm -f "$ERROR_FILE_FOR_BASH"
      
          echo "Project          : $PROJECT_FILE"
          echo "Startup method   : $STARTUP_METHOD"
          echo "Error folder     : $ERROR_FOLDER_PATH"
          echo "Expected result  : $ERROR_FILE"
          echo "User parameters:"
          jq . <<< "$USER_PARAMETERS"
      
          COMMAND=(
            "$TOOL4D_EXECUTABLE"
            -p "$PROJECT_FILE"
            --skip-onstartup
            "--startup-method=$STARTUP_METHOD"
            --dataless
            "--user-param=$USER_PARAMETERS"
          )
      
          printf 'Command:'
          printf ' %q' "${COMMAND[@]}"
          printf '\n'
      
          set +e
          "${COMMAND[@]}"
          TOOL4D_EXIT_CODE=$?
          set -e
      
          echo "tool4d exit code: $TOOL4D_EXIT_CODE"
      
          {
            echo "exit_code=$TOOL4D_EXIT_CODE"
            echo "error_file=$ERROR_FILE"
            echo "error_file_for_bash=$ERROR_FILE_FOR_BASH"
          } >> "$GITHUB_OUTPUT"

      - name: Read syntax-check result
        id: syntax-result
        if: always() && steps.run-tool4d.outcome != 'skipped'
        shell: bash
        env:
          ERROR_FILE: ${{ steps.run-tool4d.outputs.error_file }}
          ERROR_FILE_FOR_BASH: ${{ steps.run-tool4d.outputs.error_file_for_bash }}
          TOOL4D_EXIT_CODE: ${{ steps.run-tool4d.outputs.exit_code }}
        run: |
          set -euo pipefail
      
          if [[ -z "$ERROR_FILE_FOR_BASH" ]]; then
            echo "::error::Expected error-file path was not produced."
            exit 1
          fi
      
          if [[ ! -f "$ERROR_FILE_FOR_BASH" ]]; then
            echo "::error::tool4d did not create the expected result file:"
            echo "::error::$ERROR_FILE"
            echo "::error::tool4d exit code: ${TOOL4D_EXIT_CODE:-unknown}"
            exit 1
          fi
      
          if ! jq -e . "$ERROR_FILE_FOR_BASH" >/dev/null 2>&1; then
            echo "::error::The tool4d result file is not valid JSON:"
            echo "::error::$ERROR_FILE"
            exit 1
          fi
      
          SUCCESS="$(
            jq -er '
              if .success == true then
                "true"
              elif .success == false then
                "false"
              else
                error("The success property is missing or is not boolean")
              end
            ' "$ERROR_FILE_FOR_BASH"
          )"
      
          echo "tool4d result file: $ERROR_FILE"
          echo "Syntax success    : $SUCCESS"
      
          echo "Result JSON:"
          jq . "$ERROR_FILE_FOR_BASH"
      
          {
            echo "success=$SUCCESS"
            echo "error_file=$ERROR_FILE"
          } >> "$GITHUB_OUTPUT"

      - name: Add result to job summary
        if: always()
        shell: bash
        env:
          PROJECT_FILE: ${{ steps.resolve.outputs.project_file }}
          TOOL4D_VERSION: ${{ steps.resolve.outputs.tool4d_version }}
          COMPATIBILITY_VERSION: ${{ steps.resolve.outputs.compatibility_version }}
          CACHE_KEY: ${{ steps.resolve.outputs.cache_key }}
          STARTUP_METHOD: ${{ inputs.startup_method }}
        run: |
          {
            echo "## 4D syntax check"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Project | \`$PROJECT_FILE\` |"
            echo "| compatibilityVersion | \`$COMPATIBILITY_VERSION\` |"
            echo "| tool4d version | \`$TOOL4D_VERSION\` |"
            echo "| Startup method | \`$STARTUP_METHOD\` |"
            echo "| Cache key | \`$CACHE_KEY\` |"
            echo "| Result | \`${{ job.status }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
